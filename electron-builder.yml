appId: cn.chuanzhi.jingzhuang
productName: 净装
copyright: Copyright © 2026 衰气的船只
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - defaults/**/*
  - package.json
extraResources:
  # 用目录 glob 而不是单文件：Geek 官网连不上时 resources/ 可能是空的，
  # 单文件写法会直接报错中断打包，glob 匹配不到就跳过（仅失去一键卸载功能）
  - from: resources/
    to: .
    filter:
      - "**/*.exe"
  # 窗口/任务栏运行时图标（BrowserWindow 在打包后要从 resources/ 读）
  - from: build/icon.ico
    to: icon.ico
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
# ===== 微软商店（MSIX/APPX）配置 =====
# 上传商店前，把下面三项换成合作伙伴中心给你的真实值，详见 STORE.md
appx:
  applicationId: JingZhuang
  # 注意：identityName 只允许「字母数字 + 点 + 短横线」，不能有下划线/中文/空格
  # 中文产品名会被合作伙伴中心自动转成哈希形式，这是正常的
  identityName: 31096ADE.1281421F2F1D5          # 合作伙伴中心「产品标识」里的 Identity Name
  publisher: CN=EDFD9F3C-211F-42CA-B6B9-3A9E55BEEEBC   # 合作伙伴中心「产品标识」里的 Publisher
  # 最低系统版本：electron-builder 默认写死 10.0.14316.0（2016 年的 Win10 预览版），
  # 远低于 Electron 33 / Chromium 实际能跑的下限，会让不兼容的系统装上却打不开。
  # 这里对齐真实下限 Windows 10 1809，并与商店表单里填的「系统要求」保持一致。
  minVersion: 10.0.17763.0                     # Windows 10 版本 1809
  maxVersionTested: 10.0.19045.0               # 实际测试环境：Windows 10 22H2
  publisherDisplayName: 衰气的船只
  displayName: 净装
  backgroundColor: '#0e8a6d'
  languages:
    - zh-CN
  showNameOnTiles: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 净装
  uninstallDisplayName: 净装
  deleteAppDataOnUninstall: false
  artifactName: JingZhuang-Setup-${version}.exe
