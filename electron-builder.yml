appId: cn.chuanzhi.jingzhuang
productName: 净装
copyright: Copyright © 2026 衰气的船只
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - defaults/**/*
  - package.json
extraResources:
  # 用目录 glob 而不是单文件：Geek 官网连不上时 resources/ 可能是空的，
  # 单文件写法会直接报错中断打包，glob 匹配不到就跳过（仅失去一键卸载功能）
  - from: resources/
    to: .
    filter:
      - "**/*.exe"
  # 窗口/任务栏运行时图标（BrowserWindow 在打包后要从 resources/ 读）
  - from: build/icon.ico
    to: icon.ico
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
# ===== 微软商店（MSIX/APPX）配置 =====
# 上传商店前，把下面三项换成合作伙伴中心给你的真实值，详见 STORE.md
appx:
  applicationId: JingZhuang
  # 注意：identityName 只允许「字母数字 + 点 + 短横线」，不能有下划线/中文/空格
  identityName: REPLACEME.JingZhuang           # 合作伙伴中心「产品标识」里的 Identity Name
  publisher: CN=REPLACEME-PUBLISHER-ID         # 合作伙伴中心给你的 Publisher ID（CN=... 格式）
  publisherDisplayName: 衰气的船只
  displayName: 净装
  backgroundColor: '#0e8a6d'
  languages:
    - zh-CN
  showNameOnTiles: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 净装
  uninstallDisplayName: 净装
  deleteAppDataOnUninstall: false
  artifactName: JingZhuang-Setup-${version}.exe
